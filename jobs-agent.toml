# Germany Job Agent configuration.
# Re-run the "Set up my job agent" workflow, or edit this file by hand.
# Reference: https://github.com/ot-coder/germany-job-agent#configuration
#
# This copy is the project author's search: early-career technology and
# technology-adjacent roles across Germany. How it ranks: guides/ranking.md

[profile]
title = "Germany CS Jobs"
subtitle = "Live Werkstudent and entry-level technology roles, ranked for computer-science students in Germany."
# Only needed for "local" categories.
city = ""
radius_km = 35
nearby_towns = []
# 0-100. Jobs below min_score are hidden; new jobs at notify_min_score or above
# (at most notify_limit per day) are sent as your daily notification.
min_score = 65
notify_min_score = 75
notify_limit = 5
include_remote = true
# Optional: your own Google OAuth client ID for Gmail auto-detection (see guides/gmail.md).
gmail_client_id = ""

[[categories]]
id = "tech"
label = "Tech & adjacent roles"
scope = "germany"
# "any" = every non-senior role. Senior/lead/head-of titles are always rejected.
levels = ["any"]
# Searches sent to the Bundesagentur für Arbeit job board.
queries = [
    "werkstudent informatik",
    "werkstudent software",
    "werkstudent softwareentwicklung",
    "werkstudent data",
    "werkstudent machine learning",
    "werkstudent IT",
    "junior softwareentwickler",
    "junior developer",
    "graduate software engineer",
    "junior data analyst",
    "junior data engineer",
    "junior devops",
    "junior cybersecurity",
    "werkstudent projektmanagement",
    "junior projektmanager",
    "product management intern",
    "junior product manager",
    "projektkoordinator IT",
    "PMO werkstudent",
    "werkstudent business analyst",
    "junior business analyst",
    "IT consultant berufseinsteiger",
    "werkstudent IT service management",
    "junior application manager",
    "application support junior",
    "junior system analyst",
    "implementation consultant junior",
]

# Role families are checked against the job title, in this order; the first match wins.
# points = role-fit share of the 100-point score (max 20).

[[categories.families]]
id = "CORE_TECH"
label = "Core Tech"
points = 20
# A title with one of these hints joins this family if the description confirms it.
title_hints = [" data ", " digital ", " tech ", " it ", " ki ", " cloud ", " cyber ", " system ", " systems ", " analytics ", " platform "]
