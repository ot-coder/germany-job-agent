# Germany Job Agent configuration.
# Re-run the "Set up my job agent" workflow (Actions tab), or edit this file by hand.
# Reference: https://github.com/ot-coder/germany-job-agent#configuration

[profile]
title = "Germany Student Jobs"
subtitle = "Computer-science opportunities across Germany; part-time and minijob listings are restricted to Leipzig and nearby towns."
city = "Leipzig"
radius_km = 35
# 'local' tabs only keep jobs in these towns (plus the city itself). Leave empty to
# trust the Bundesagentur radius search instead.
nearby_towns = [
  "markkleeberg", "schkeuditz", "taucha", "markranstädt", "zwenkau", "böhlen", "rötha",
  "großpösna", "rackwitz", "borsdorf", "brandis", "machern", "naunhof", "krostitz",
  "delitzsch", "eilenburg", "borna", "grimma", "wurzen", "neukieritzsch", "pegau",
]
min_score = 55
include_remote = true
# Optional: your own Google OAuth client ID for Gmail auto-detection (see guides/gmail.md).
gmail_client_id = ""

[[categories]]
id = "cs"
label = "CS & Tech"
scope = "germany"
relevance_reason = "Computer-science relevance"
# A job title must contain one of these to count as this field.
keywords = [
  "software", "developer", "engineer", "data", "python", "java", "javascript",
  "typescript", "cloud", "devops", "security", "cyber", "machine learning", " ai ",
  "frontend", "backend", "full stack", "fullstack", "qa", "test automation",
  "computer science", "informatik", "information technology", "product analyst",
  "business intelligence", "database", "systems administrator", "systemadministrator",
  "it support", "it-support", "web development",
]
levels = ["werkstudent", "entry-level", "part-time", "minijob"]
# Searches sent to the Bundesagentur für Arbeit job board.
queries = ["werkstudent informatik", "werkstudent software", "junior softwareentwickler", "berufseinsteiger informatik"]

[[categories]]
id = "part-time"
label = "Part-time & Minijob"
scope = "local"
keywords = []
levels = ["werkstudent", "part-time", "minijob"]
queries = ["minijob", "teilzeit", "studentenjob", "aushilfe lager", "aushilfe gastronomie", "aushilfe restaurant"]
