[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "germany-job-agent"
version = "0.2.0"
description = "Find German job listings for your field and city, get a daily digest, and track your applications — no server, no account"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/ot-coder/germany-job-agent"

[project.scripts]
jobs-agent = "jobs_agent.cli:main"

[tool.setuptools]
packages = ["jobs_agent"]

[tool.setuptools.package-data]
jobs_agent = ["site/*"]
