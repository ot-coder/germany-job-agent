name: Refresh jobs and deploy dashboard

on:
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: "Send a test notification (GitHub issue, plus Telegram if configured)"
        required: false
        type: boolean
        default: false
  # setup.yml calls this after saving a new configuration, so the first build,
  # artifact upload and Pages deploy happen in the same run. (Its push, made
  # with GITHUB_TOKEN, would not trigger a workflow by itself.)
  workflow_call:
    inputs:
      send_test_notification:
        description: "Send a test notification (GitHub issue, plus Telegram if configured)"
        required: false
        type: boolean
        default: false
  schedule:
    # GitHub cron uses UTC. Running at 06:00 and 07:00 lets the gate below
    # select 08:00 Europe/Berlin across daylight-saving changes.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
  actions: read # deploy-pages looks up the uploaded artifact

concurrency:
  group: jobs-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.ready.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch tip, not github.sha: when setup.yml calls this workflow,
          # github.sha is the commit from before setup pushed the new config.
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Select the 08:00 Europe/Berlin scheduled run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python -m jobs_agent.schedule

      # Copies made from the template get this schedule straight away. Skip
      # quietly (instead of failing or publishing the template author's search)
      # until the owner has run the setup form and turned on Pages.
      - name: Check this copy is set up and Pages deploys from Actions
        if: steps.gate.outputs.run == 'true'
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The upstream repository is the template itself; every copy is not.
          if grep -q "project author's search" jobs-agent.toml \
             && [ "$(gh api "repos/$REPO" --jq .is_template 2>/dev/null)" = "false" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Set up your job agent first"
              echo "This copy still has the template author's search. Go to **Actions → Set up my job agent →"
              echo "Run workflow** and enter your own job field and city. Your first search starts automatically."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Skipped: run \"Set up my job agent\" first so this copy searches for your jobs."
          elif [ "$(gh api "repos/$REPO/pages" --jq .build_type 2>/dev/null)" = "workflow" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "## GitHub Pages is not set up yet"
              echo "Open https://github.com/$REPO/settings/pages, choose **GitHub Actions** under"
              echo "**Build and deployment → Source**, then run this workflow again."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Skipped: GitHub Pages is not set to deploy from GitHub Actions yet."
          fi

      - name: Configure GitHub Pages
        if: steps.ready.outputs.run == 'true'
        id: pages
        uses: actions/configure-pages@v6

      - name: Fetch live jobs and build static dashboard
        if: steps.ready.outputs.run == 'true'
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: >-
          python -m jobs_agent publish
          --docs docs
          --message .out/telegram.txt
          --digest .out/digest.md
          --site-url "$SITE_URL"

      - name: Prepare requested test notification
        if: steps.ready.outputs.run == 'true' && inputs.send_test_notification
        run: |
          mkdir -p .out
          printf '%s\n' "✅ Cloud workflow test: Germany Job Agent can send notifications from GitHub Actions." > .out/telegram.txt
          printf '%s\n\n%s\n' "✅ Cloud workflow test: Germany Job Agent can send notifications from GitHub Actions." "$(cat .out/digest.md)" > .out/digest.md

      - name: Notify via GitHub issue
        if: steps.ready.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ ! -s .out/digest.md ]; then echo "No digest generated."; exit 0; fi
          day="$(TZ=Europe/Berlin date +%F)"
          printf '\n---\ncc @%s · Daily digest from your job agent. Older digests close automatically.\n' "$OWNER" >> .out/digest.md
          gh label create daily-digest --color 0f766e --description "Daily job digest" 2>/dev/null || true
          for n in $(gh issue list --label daily-digest --state open --json number --jq '.[].number'); do
            gh issue close "$n" --reason completed >/dev/null || true
          done
          if ! gh issue create --title "Job digest · $day" --label daily-digest --assignee "$OWNER" --body-file .out/digest.md; then
            gh issue create --title "Job digest · $day" --label daily-digest --body-file .out/digest.md \
              || echo "::warning::Could not open the digest issue. Enable Issues under Settings → General → Features."
          fi

      - name: Send Telegram daily update (optional)
        if: steps.ready.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -s .out/telegram.txt ] && [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            python -m jobs_agent.telegram
          elif [ -s .out/telegram.txt ]; then
            echo "Telegram update is ready, but Telegram secrets are not configured yet."
          else
            echo "No Telegram update was generated; notification skipped."
          fi

      - name: Commit refreshed job data
        if: steps.ready.outputs.run == 'true'
        run: |
          git config user.name "jobs-agent[bot]"
          git config user.email "jobs-agent[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh live job listings"
            git push
          else
            echo "No dashboard changes to commit."
          fi

      - name: Upload dashboard artifact
        if: steps.ready.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  # A separate job, not a step right after the upload: deploy-pages can miss an
  # artifact finalised a moment earlier in the same job ("Found 0 artifact(s)",
  # actions/deploy-pages#451). Starting after the refresh job completes avoids it.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v5
